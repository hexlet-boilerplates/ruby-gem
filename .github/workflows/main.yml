name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Ставит Ruby и hk из mise.toml, версии зафиксированы в mise.lock
      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: make install

      - name: Run Rubocop
        run: make lint
